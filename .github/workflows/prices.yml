name: Napi árfrissítés
on:
  schedule:
    - cron: '20 4,10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: prices
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Árak letöltése és oldalak újraépítése
        run: node scripts/update.mjs
        env:
          SITE_URL: https://barmiar.hu/
      - name: Változások mentése
        run: |
          git config user.name "barmiar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Árfrissítés $(date +%F)"
          git push
